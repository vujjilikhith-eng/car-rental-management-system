{% extends "base.html" %}
{% block page_title %}{{ 'Edit Rate Plan' if plan else 'Add Rate Plan' }}{% endblock %}
{% block content %}

<div class="card p-4" style="max-width:520px;">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Category</label>
      <select name="category_id" class="form-select" required>
        {% for c in categories %}
          <option value="{{ c.category_id }}" {{ 'selected' if plan and plan.category_id == c.category_id }}>{{ c.category_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Daily Rate (₹)</label>
      <input type="number" step="0.01" name="daily_rate" class="form-control" required value="{{ plan.daily_rate if plan else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Per KM Rate (₹)</label>
      <input type="number" step="0.01" name="per_km_rate" class="form-control" required value="{{ plan.per_km_rate if plan else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Effective From</label>
      <input type="date" name="effective_from" class="form-control" required value="{{ plan.effective_from if plan else '' }}">
    </div>
    <button class="btn btn-brand">Save</button>
    <a href="{{ url_for('rateplans.index') }}" class="btn btn-link">Cancel</a>
  </form>
</div>
{% endblock %}
