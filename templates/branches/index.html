{% extends "base.html" %}
{% block page_title %}Branches{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <div class="section-title mb-0">All Branches</div>
  <a href="{{ url_for('branches.new') }}" class="btn btn-brand"><i class="bi bi-plus-lg"></i> Add Branch</a>
</div>

<div class="card p-3">
  <div class="table-responsive">
    <table class="table align-middle">
      <thead><tr><th>ID</th><th>Branch Name</th><th>City</th><th>Phone</th><th></th></tr></thead>
      <tbody>
      {% for b in branches %}
        <tr>
          <td>{{ b.branch_id }}</td>
          <td>{{ b.branch_name }}</td>
          <td>{{ b.city }}</td>
          <td>{{ b.phone }}</td>
          <td class="text-end">
            <a href="{{ url_for('branches.edit', branch_id=b.branch_id) }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
            <form action="{{ url_for('branches.delete', branch_id=b.branch_id) }}" method="post" class="d-inline" onsubmit="return confirm('Delete this branch?');">
              <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="5" class="text-muted">No branches yet.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
