{% extends "base.html" %}
{% block page_title %}New Reservation{% endblock %}
{% block content %}

<div class="card p-4" style="max-width:600px;">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Customer</label>
      <select name="customer_id" class="form-select" required>
        <option value="" disabled selected>Select customer</option>
        {% for c in customers %}
          <option value="{{ c.customer_id }}">{{ c.name }} — {{ c.phone }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Vehicle (only available vehicles shown)</label>
      <select name="vehicle_id" class="form-select" required>
        <option value="" disabled selected>Select vehicle</option>
        {% for v in vehicles %}
          <option value="{{ v.vehicle_id }}">{{ v.reg_number }} — {{ v.model }} ({{ v.category_name }}, {{ v.branch_name }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Pickup Branch</label>
      <select name="branch_id" class="form-select" required>
        {% for b in branches %}
          <option value="{{ b.branch_id }}">{{ b.branch_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Start Date</label>
        <input type="date" name="start_date" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">End Date</label>
        <input type="date" name="end_date" class="form-control" required>
      </div>
    </div>
    <div class="alert alert-info small">
      The system checks for overlapping bookings on the selected vehicle automatically — you can't double-book.
    </div>
    <button class="btn btn-brand">Create Reservation</button>
    <a href="{{ url_for('reservations.index') }}" class="btn btn-link">Cancel</a>
  </form>
</div>
{% endblock %}
